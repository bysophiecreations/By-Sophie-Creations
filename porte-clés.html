<script>

const creations = [

    {photo:"PC1.jpg", description:"Diamant rouge", prix:"3 €"},
    {photo:"PC3.jpg", description:"Diamant blanc", prix:"3 €"},
    {photo:"PC4.jpg", description:"Pièce de puzzle", prix:"3 €"},
    {photo:"PC6.jpg", description:"Porte-clé prénom", prix:"5 €"},
    {photo:"PC7.jpg", description:"Papillon", prix:"3 € unité"},
    {photo:"PC8.jpg", description:"Porte-clé personnalisable", prix:"5,50 €"},
    {photo:"PC12.jpg", description:"Oval de cristal avec un coeur émeraude", prix:"2 €"},
    {photo:"PC13.jpg", description:"Ourson vert kaki pailleté", prix:"3 €"},
    {photo:"PC17.jpg", description:"Coeur avec inscription LOVE dans un cercle transparent", prix:"3 €"},
{photo:"PC21.jpg", description:"Tortue blanche sur la plage", prix:"3 €"},
{photo:"PC22.jpg", description:"Levé de soleil sur un palmier", prix:"4 €"},
{photo:"PC23.jpg", description:"Oval transparent avec arbre de vie blanc et inscription La vie est belle", prix:"4 €"},
{photo:"PC24.jpg", description:"Oval jaune incrusté avec un mignon petit renard", prix:"4 €"},
{photo:"PC25.jpg", description:"Oval jaune incrusté avec une fée et des étoiles", prix:"3 €"},
{photo:"PC26.jpg", description:"Double porte-clés Elle et lui avec lapin et marguerite", prix:"5 €"},
{photo:"PC27.jpg", description:"Oval violet avec une hibou", prix:"3 €"},
{photo:"PC28.jpg", description:"Oval transparent avec un panda", prix:"3 €"},


];
// Mélange les créations
creations.sort(() => Math.random() - 0.5);

const galerie = document.getElementById("galerie");





function afficherGalerie(liste) {

    galerie.innerHTML = "";

    liste.forEach(c => {

        galerie.innerHTML += `
            <div class="creation">

                <img src="images/${c.photo}"
                     alt="${c.description}"
                     class="photo-produit"
                     onclick="event.stopPropagation(); ouvrirProduit('${c.photo}','${c.description}','${c.prix}')">

                <p class="description">${c.description}</p>

                <p class="prix">${c.prix}</p>

                <button class="btn-panier"
                    onclick="ajouterAuPanier('${c.description}','${c.prix}','${c.photo}')">
                    Ajouter au panier
                </button>

            </div>
        `;
    });

}

afficherGalerie(creations);


function appliquerFiltres() {

    let liste = [...creations];

    const couleur = document.getElementById("filtreCouleur").value;

    if (couleur !== "") {
        liste = liste.filter(c =>
            c.couleur &&
            c.couleur.toLowerCase().includes(couleur.toLowerCase())
        );
    }

    const tri = document.getElementById("triPrix").value;

    if (tri === "croissant") {
        liste.sort((a, b) => prixNombre(a.prix) - prixNombre(b.prix));
    }

    if (tri === "decroissant") {
        liste.sort((a, b) => prixNombre(b.prix) - prixNombre(a.prix));
    }

    afficherGalerie(liste);
}

document.getElementById("filtreCouleur")
        .addEventListener("change", appliquerFiltres);

document.getElementById("triPrix")
        .addEventListener("change", appliquerFiltres);


function afficherNotification(){

    const notif = document.getElementById("notificationPanier");

    if (!notif) return;

    notif.classList.add("afficher");

    setTimeout(function(){
        notif.classList.remove("afficher");
    },2000);

}


function ajouterAuPanier(description, prix, photo) {

    let panier = JSON.parse(localStorage.getItem("panier")) || [];

    panier.push({
        description: description,
        prix: prix,
        photo: photo
    });

    localStorage.setItem("panier", JSON.stringify(panier));

    mettreAJourPanier();

    afficherNotification();
}
let produitSelectionne = null;

function ouvrirProduit(photo, description, prix){

    produitSelectionne = {photo, description, prix};

    document.getElementById("popupImage").src="images/"+photo;
    document.getElementById("popupTitre").textContent=description;
    document.getElementById("popupPrix").textContent=prix;

    document.getElementById("popupProduit").classList.add("afficher");
}

document.addEventListener("DOMContentLoaded", function () {

    document.querySelector(".fermerPopup").addEventListener("click", function () {
        document.getElementById("popupProduit").classList.remove("afficher");
    });

});



</script>
<script>
document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});
</script>
<script>
document.onkeydown = function(e){
    if (e.keyCode == 123) {
        return false;
    }

    if (e.ctrlKey && e.shiftKey && e.keyCode == 73) {
        return false;
    }

    if (e.ctrlKey && e.shiftKey && e.keyCode == 74) {
        return false;
    }

    if (e.ctrlKey && e.keyCode == 85) {
        return false;
    }
}
</script>

document.querySelectorAll("img").forEach(img => {

img.setAttribute("draggable","false");

img.addEventListener("dragstart", function(e){
e.preventDefault();
});

});

</script>

<script>
function mettreAJourPanier() {

    const panier = JSON.parse(localStorage.getItem("panier")) || [];
    const badge = document.getElementById("nbArticles");

    if (panier.length > 0) {
        badge.textContent = panier.length;
        badge.style.display = "flex";
    } else {
        badge.style.display = "none";
    }
}
</script>
<script>
mettreAJourPanier();
</script>
<script src="panier.js"></script>
<div id="notificationPanier">
    ✅ Article ajouté au panier
</div>
<div id="popupProduit" class="popup-produit">

    <div class="popup-contenu">

        <span class="fermerPopup">&times;</span>

        <img id="popupImage" src="" alt="">

        <h2 id="popupTitre"></h2>

        <p id="popupPrix"></p>

        <button id="popupPanier" class="btn-panier">
            Ajouter au panier
        </button>

    </div>

</div>
<script>
const popup = document.getElementById("popupProduit");
const boutonPopup = document.getElementById("popupPanier");
const fermer = document.querySelector(".fermerPopup");

fermer.addEventListener("click", () => {
    popup.classList.remove("afficher");
});

popup.addEventListener("click", (e) => {
    if (e.target === popup) {
        popup.classList.remove("afficher");
    }
});

boutonPopup.addEventListener("click", () => {

    if (!produitSelectionne) return;

    ajouterAuPanier(
        produitSelectionne.description,
        produitSelectionne.prix,
        produitSelectionne.photo
    );

    popup.classList.remove("afficher");
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);
    const produit = params.get("produit");

    if (!produit) return;

    const produitTrouve = creations.find(function(c) {
        return c.photo === produit;
    });

    if (!produitTrouve) return;

    ouvrirProduit(
        produitTrouve.photo,
        produitTrouve.description,
        produitTrouve.prix
    );

});
</script>
